[project]
name = "ai-explainer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "pillow",
    "scikit-learn",
    "torch",
    "torchmetrics",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests/ai_explainer"]
pythonpath = ["tests/support"]
markers = ["asset", "golden", "video"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
src = ["src", "tests/support"]
line-length = 100

[tool.ruff.lint]
select = [
    # quality
    "F", "S", "B", "ANN", "RUF", "SLF", "ARG", "PERF", "PT",
    # documentation
    "D",
    # conventions
    "SIM", "C4", "UP", "A",
    # style
    "E", "W", "I", "N", "Q",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "D"]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
extra-paths = ["tests/support"]
